<main>
    <section class="hero">
        <div class="container">
            <h1>Contacto</h1>
            <p>Estamos aquí para ayudarte. Ponte en contacto con nosotros.</p>
        </div>
    </section>

    <section class="container">
        <div class="card">
            <h2>Información de Contacto</h2>
            <p><strong>Email:</strong> info@misitioweb.com</p>
            <p><strong>Teléfono:</strong> +1 (555) 123-4567</p>
            <p><strong>Dirección:</strong> Calle Principal 123, Ciudad, País</p>
        </div>

        <div class="card">
            <h2>Envíanos un Mensaje</h2>
            <form>
                <div class="form-group">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" placeholder="Tu nombre completo">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="tu@email.com">
                </div>

                <div class="form-group">
                    <label for="message">Mensaje:</label>
                    <textarea id="message" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
                </div>

                <button type="submit">Enviar Mensaje</button>
            </form>
        </div>
    </section>
</main>
